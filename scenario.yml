version: 1

name: Denpasar Weather Scenario

author: Surya

steps:

  # ==================================================
  # 1. PAGI HARI
  # Denpasar sekitar 07.00 WITA
  # ==================================================

  - delay: 2s

  - set-control:
      part-id: dht1
      control: temperature
      value: 26.0

  - set-control:
      part-id: dht1
      control: humidity
      value: 80

  - set-control:
      part-id: ldr1
      control: lux
      value: 1000

  - delay: 6s


  # ==================================================
  # 2. SIANG HARI TERIK
  # Denpasar sekitar 12.00 WITA
  # ==================================================

  - set-control:
      part-id: dht1
      control: temperature
      value: 33.5

  - set-control:
      part-id: dht1
      control: humidity
      value: 55

  - set-control:
      part-id: ldr1
      control: lux
      value: 4000

  - delay: 6s


  # ==================================================
  # 3. SORE HARI
  # Denpasar sekitar 17.30 WITA
  # ==================================================

  - set-control:
      part-id: dht1
      control: temperature
      value: 28.0

  - set-control:
      part-id: dht1
      control: humidity
      value: 68

  - set-control:
      part-id: ldr1
      control: lux
      value: 300

  - delay: 6s


  # ==================================================
  # 4. MALAM HARI
  # Denpasar sekitar 21.00 WITA
  # ==================================================

  - set-control:
      part-id: dht1
      control: temperature
      value: 24.5

  - set-control:
      part-id: dht1
      control: humidity
      value: 85

  - set-control:
      part-id: ldr1
      control: lux
      value: 0

  - delay: 6s
