<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Monitoring IoT</title>
  <!-- CDN MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
    .card-container { display: flex; gap: 15px; flex-wrap: wrap; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); min-width: 150px; text-align: center; }
    .value { font-size: 24px; font-weight: bold; color: #007bff; margin-top: 10px; }
    #status { font-weight: bold; margin-bottom: 20px; }
    .connected { color: green; }
    .disconnected { color: red; }
  </style>
</head>
<body>

  <h2>HiveMQ IoT Monitoring Dashboard</h2>
  <div id="status" class="disconnected">Status: Terputus</div>

  <div class="card-container">
    <div class="card">Suhu<div id="temp" class="value">- °C</div></div>
    <div class="card">Kelembapan<div id="hum" class="value">- %</div></div>
    <div class="card">Jarak<div id="dist" class="value">- cm</div></div>
    <div class="card">Cahaya<div id="lux" class="value">-</div></div>
  </div>

  <script>
    // Konfigurasi WebSocket HiveMQ Cloud Anda
    const options = {
      connectTimeout: 4000,
      clientId: 'WebClient-' + Math.random().toString(16).substring(2, 8),
      username: 'B-127',
      password: '#BumbleB33*',
    };

    // WSS URL menggunakan port WebSocket HiveMQ (8884)
    const host = 'wss://f0a6886bea0d4650be2e2293bcb31c66.s1.eu.hivemq.cloud:8884/mqtt';

    console.log('Menghubungkan ke HiveMQ Cloud...');
    const client = mqtt.connect(host, options);

    const statusEl = document.getElementById('status');

    // Event saat berhasil terhubung
    client.on('connect', () => {
      console.log('Terhubung ke Broker!');
      statusEl.textContent = 'Status: Terhubung';
      statusEl.className = 'connected';

      // Subscribe ke topik sensor Anda
      client.subscribe('sensor/data', (err) => {
        if (!err) {
          console.log('Berhasil Subscribe ke topik: sensor/data');
        }
      });
    });

    // Event saat menerima pesan dari ESP32
    client.on('message', (topic, message) => {
      console.log('Pesan diterima:', message.toString());
      try {
        const data = JSON.parse(message.toString());
        
        // Update elemen HTML
        if(data.temp !== undefined) document.getElementById('temp').innerText = data.temp + ' °C';
        if(data.hum !== undefined) document.getElementById('hum').innerText = data.hum + ' %';
        if(data.dist !== undefined) document.getElementById('dist').innerText = data.dist + ' cm';
        if(data.lux !== undefined) document.getElementById('lux').innerText = data.lux;
      } catch (e) {
        console.error('Gagal parse JSON:', e);
      }
    });

    // Event jika koneksi error / terputus
    client.on('error', (err) => {
      console.error('Koneksi error:', err);
    });

    client.on('close', () => {
      statusEl.textContent = 'Status: Terputus';
      statusEl.className = 'disconnected';
    });
  </script>
</body>
</html>
